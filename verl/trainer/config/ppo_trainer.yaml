data:
  tokenizer: null
  train_files: ~/data/rlhf/gsm8k/train.parquet
  val_files: ~/data/rlhf/gsm8k/test.parquet
  train_data_num: null
  val_data_num: null
  prompt_key: prompt
  max_prompt_length: 512
  max_response_length: 512
  max_start_length: 256
  max_obs_length: 512
  # Complete stored agent trajectory. The rolling prompt remains bounded by
  # max_prompt_length, but reward/training retains the full interaction tail.
  max_trajectory_length: 1024
  train_batch_size: 1024
  val_batch_size: 1312
  return_raw_input_ids: False  # This should be set to true when the tokenizer between policy and rm differs
  return_raw_chat: False
  shuffle_train_dataloader: True

actor_rollout_ref:
  hybrid_engine: True
  model:
    path: ~/models/deepseek-llm-7b-chat
    external_lib: null
    override_config: { }
    enable_gradient_checkpointing: False
    use_remove_padding: False
  actor:
    strategy: fsdp  # This is for backward-compatibility
    ppo_mini_batch_size: 256
    ppo_micro_batch_size: 64
    use_dynamic_bsz: False
    ppo_max_token_len_per_gpu: 16384 # n * ${data.max_prompt_length} + ${data.max_response_length}
    grad_clip: 1.0
    state_masking: False
    clip_ratio: 0.2
    entropy_coeff: 0.001
    use_kl_loss: False # True for GRPO
    kl_loss_coef: 0.001 # for grpo
    kl_loss_type: low_var_kl # for grpo
    # Conditional environment-induced trust region. ``off`` preserves the
    # ordinary PPO/GRPO path; null mode falls back to the legacy enabled flag.
    eitr:
      enabled: False
      mode: null  # off | probe_only | eitr
      probe_source: online_same_state
      probe_probability: 1.0
      probe_count: 4
      # A valid state needs the real query plus at least one valid probe. Failed
      # extra probes lower K_eff; they never terminate the GRPO update.
      min_valid_probe_count: 2
      # Do not condition samples on format validity by retrying until K is full.
      probe_oversample: 0
      # Bound both candidate re-scoring forwards. These count flattened probe
      # sequences, not rollout states.
      probe_micro_batch_size: 4
      probe_logprob_micro_batch_size: 4
      # Remove invalid rows before correction and pad only to the busiest FSDP
      # rank. This changes neither active states nor the full-rollout loss.
      compact_invalid_states: true
      # HF decoder checkpointing is gated on model.training. Formal EITR runs
      # use deterministic zero-dropout train-mode probe scoring so correction
      # backward can recompute layers instead of retaining all activations.
      probe_gradient_checkpointing: false
      # Match the real per-turn generation budget. At runtime each state uses
      # only the suffix budget remaining after reasoning + <search>.
      max_query_tokens: ${data.max_response_length}
      probe_seed: 20260805
      max_action_tokens: ${data.max_response_length}
      # Must cover the complete rolling search state. Silent truncation would
      # make probe sampling and probe log-prob scoring condition on different states.
      max_probe_prompt_tokens: 4096
      max_doc_support: 32
      retrieval_score_temperature: 0.1
      require_empty_prefix: False
      # Diagnostic thresholds only; falling below them is logged and never
      # aborts GRPO or forces EITR activation.
      min_state_coverage: 0.0
      informative_js_threshold: 0.01
      min_informative_state_rate: 0.0
      # GRPO runs actor.ppo_epochs ordinary passes first. EITR then runs a
      # separate correction-only pass; probe_only re-scores without a backward.
      correction_passes: 1
      # V6 correction must not inherit GRPO AdamW momentum, moments, or decay.
      correction_optimizer: sgd
      correction_lr: null  # null inherits actor.optim.lr
      post_diagnostic_freq: 0  # 0 disables the extra post-correction re-score
      same_batch_scale_diagnostic: false  # debug-only, never enabled by formal runs
      update_direction_diagnostic: false  # one-shot +/- gradient audit only
      score_path_noop_direction_audit: false  # one-shot score-path audit only
      score_path_anchor_max_abs_logprob_diff: 1.0e-3
      lambda_env: 0.1
      log_ratio_clip: 10.0
    # Number of ordinary GRPO passes. EITR correction_passes are separate and
    # therefore do not give EITR an extra reward-bearing policy update.
    ppo_epochs: 1
    shuffle: False
    ulysses_sequence_parallel_size: 1 # sp size
    optim:
      lr: 1e-6
      lr_warmup_steps_ratio: 0.  # the total steps will be injected during runtime
      min_lr_ratio: null   # only useful for warmup with cosine
      warmup_style: constant  # select from constant/cosine
      total_training_steps: -1  # must be override by program
    fsdp_config:
      wrap_policy:
        # transformer_layer_cls_to_wrap: None
        min_num_params: 0
      param_offload: False
      grad_offload: False
      optimizer_offload: False
      # Keep rollout/probe tensors on CPU and stream only the active
      # GRPO micro-batch or EITR state chunk to the actor GPU.
      batch_offload: False
      fsdp_size: -1
  ref:
    fsdp_config:
      param_offload: False
      wrap_policy:
        # transformer_layer_cls_to_wrap: None
        min_num_params: 0
      fsdp_size: -1
    log_prob_micro_batch_size: 128
    log_prob_use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
    log_prob_max_token_len_per_gpu: ${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}
    ulysses_sequence_parallel_size: ${actor_rollout_ref.actor.ulysses_sequence_parallel_size} # sp size
  rollout:
    name: vllm
    temperature: 1.0
    top_k: -1 # 0 for hf rollout, -1 for vllm rollout
    top_p: 0.95
    prompt_length: ${data.max_prompt_length}  # not use for opensource
    response_length: ${data.max_response_length}
    # Optional engine context override. Conditional EITR sets this large enough
    # for an exact rolling search state plus its query-only continuation.
    max_model_len: null
    # for vllm rollout
    dtype: bfloat16 # should align with FSDP
    gpu_memory_utilization: 0.5
    ignore_eos: False
    enforce_eager: True
    free_cache_engine: True
    load_format: dummy_dtensor
    tensor_model_parallel_size: 2
    max_num_batched_tokens: 8192
    max_num_seqs: 1024
    log_prob_micro_batch_size: 128
    log_prob_use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
    log_prob_max_token_len_per_gpu: ${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}
    # for hf rollout
    do_sample: True
    # number of responses (i.e. num sample times)
    n: 1 # > 1 for grpo
    n_agent: 1 # different here used for agent tasks only

critic:
  strategy: fsdp
  optim:
    lr: 1e-5
    lr_warmup_steps_ratio: 0.  # the total steps will be injected during runtime
    min_lr_ratio: null   # only useful for warmup with cosine
    warmup_style: constant  # select from constant/cosine
    total_training_steps: -1  # must be override by program
  model:
    path: ~/models/deepseek-llm-7b-chat
    tokenizer_path: ${actor_rollout_ref.model.path}
    override_config: { }
    external_lib: ${actor_rollout_ref.model.external_lib}
    enable_gradient_checkpointing: False
    use_remove_padding: False
    fsdp_config:
      param_offload: False
      grad_offload: False
      optimizer_offload: False
      wrap_policy:
        # transformer_layer_cls_to_wrap: None
        min_num_params: 0
      fsdp_size: -1
  ppo_mini_batch_size: ${actor_rollout_ref.actor.ppo_mini_batch_size}
  ppo_micro_batch_size: 64
  forward_micro_batch_size: ${critic.ppo_micro_batch_size}
  use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
  ppo_max_token_len_per_gpu: 32768 # (${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}) * 2
  forward_max_token_len_per_gpu: ${critic.ppo_max_token_len_per_gpu}
  ulysses_sequence_parallel_size: 1 # sp size
  ppo_epochs: ${actor_rollout_ref.actor.ppo_epochs}
  shuffle: ${actor_rollout_ref.actor.shuffle}
  grad_clip: 1.0
  cliprange_value: 0.5

reward_model:
  enable: False
  strategy: fsdp
  model:
    input_tokenizer: ${actor_rollout_ref.model.path}  # set this to null if the chat template is identical
    path: ~/models/FsfairX-LLaMA3-RM-v0.1
    external_lib: ${actor_rollout_ref.model.external_lib}
    use_remove_padding: False
    fsdp_config:
      min_num_params: 0
      param_offload: False
  micro_batch_size: 64
  max_length: null
  ulysses_sequence_parallel_size: 1 # sp size
  use_dynamic_bsz: ${critic.use_dynamic_bsz}
  forward_max_token_len_per_gpu: ${critic.forward_max_token_len_per_gpu}
  structure_format_score: 0
  final_format_score: 0
  retrieval_score: 0

retriever:
  url: "http://127.0.0.1:8000/retrieve"
  topk: 3

algorithm:
  gamma: 1.0
  lam: 1.0
  adv_estimator: gae
  no_think_rl: False
  kl_penalty: kl  # how to estimate kl divergence
  kl_ctrl:
    type: fixed
    kl_coef: 0.001
  state_masking:
    start_state_marker: "<information>"
    end_state_marker: "</information>"

trainer:
  total_epochs: 30
  total_training_steps: null
  project_name: verl_examples
  experiment_name: gsm8k
  logger: [ 'console', 'wandb' ]
  # debug logs every internal diagnostic; core keeps the formal W&B view compact.
  metrics_level: debug
  # Print this many real prompt/trajectory/reward examples per outer update.
  # Zero keeps generic veRL jobs quiet; the EITR runner enables one sample.
  console_trace_samples: 0
  nnodes: 1
  n_gpus_per_node: 8
  save_freq: -1
  test_freq: -1
  # false: Search-R1-compatible model/tokenizer only; true: also save exact-resume state.
  save_full_checkpoint: false
  resume_from_checkpoint: null
  critic_warmup: 0
  default_hdfs_dir: ~/experiments/gsm8k/ppo/${trainer.experiment_name}
  default_local_dir: checkpoints/${trainer.project_name}/${trainer.experiment_name}

max_turns: 10
do_search: true
